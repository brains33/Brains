<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="staphy.css">
    <title>BRAINS AI | ADMIN LOGIN</title>

    <!-- CSP (Content Security Policy) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                   style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
                   img-src 'self' data: https:;
                   connect-src 'self' https://gjznwgzoqpfdnxywixgv.supabase.co;
                   font-src 'self' https://cdnjs.cloudflare.com;
                   frame-src https://meet.jit.si;">
</head>
<body>

    <div class="login-card">
        <h1>ADMIN ACCESS</h1>
        <p>BRAINS AI MASTER CONTROL</p>
        
        <div id="msg" class="alert"></div>

        <div class="input-group">
            <label>ADMIN USERNAME</label>
            <input type="text" id="name" placeholder="Username">
        </div>

        <div class="input-group">
            <label>OFFICIAL GMAIL</label>
            <input type="email" id="email" placeholder="admin@example.com">
        </div>

        <div class="input-group">
            <label>ACCESS PASSWORD</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="loginButton">LOGIN TO PANEL</button>

        <div class="links">
            <span style="opacity: 0.6; font-size: 0.8em;">Are you a student?</span> 
            <a href="login2.html" style="color:var(--primary); font-size: 0.8em;">Login Here</a>
        </div>
    </div>

    <div id="otpModal">
        <div class="modal-content">
            <h3 style="color:#00ff88; margin-top:0;">Verify Identity</h3>
            <p style="font-size:0.8em; color:white;">A 6-digit code was sent to your Gmail.</p>
            <input type="number" id="modalOtpInput" placeholder="••••••" 
                   style="width:100%; padding:12px; margin-bottom:15px; text-align:center; letter-spacing:8px; font-size:1.5em; font-weight:bold; background:#072216; border:1px solid #00ff88; border-radius:8px; color:white;">
            <button id="verifyOtpButton" style="background:#00ff88; color:#0a2e1f; border:none; padding:12px; border-radius:8px; font-weight:bold; width:100%; cursor:pointer;">VERIFY & ENTER</button>
            <p id="cancelOtp" style="font-size:0.7em; margin-top:15px; cursor:pointer; color:#00ff88;">Cancel</p>
        </div>
    </div>

    <marquee behavior="alternate">BRAINS AI CBT SYSTEM &copy; 2026 | MU'UJIZA DATA SECURED</marquee>

    <script src="staphy.js"></script>
</body>
</html>
