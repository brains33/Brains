<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="exam.css" type="text/css" media="all" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINS AI CBT - Secure Exam</title>

    <!-- CSP (Content Security Policy) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                   style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
                   img-src 'self' data: https: blob:;
                   media-src 'self' blob: mediastream:;
                   connect-src 'self' https://gjznwgzoqpfdnxywixgv.supabase.co;
                   font-src 'self' https://cdnjs.cloudflare.com;
                   frame-src 'none';
                   frame-ancestors 'none';
                   object-src 'none';
                   base-uri 'self';">

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            loader: { load: ['[tex]/mhchem'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- CAMERA AREA (unchanged) -->
<div id="cameraArea" style="position: fixed; top: 10px; right: 10px; width: 120px; z-index: 9999; background: #000; border: 2px solid #00ff88; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;">
    <p style="color: #00ff88; font-size: 8px; margin: 2px 0; font-weight: bold; font-family: sans-serif;">📡 LIVE</p>
    <video id="proctorVideo" autoplay muted playsinline style="width: 100%; height: 90px; object-fit: cover; display: block; background: #222;"></video>
    <canvas id="proctorCanvas" width="320" height="240" style="display:none;"></canvas>
    <button id="camRetry" style="display:none; font-size: 8px; background: #ff4444; color: white; border: none; width: 100%; padding: 5px; cursor: pointer;">RESTART CAM</button>
</div>

<!-- PROGRESS BAR -->
<div id="progressBar" style="width: 0%;"></div>

<!-- TOP BAR (with calculator button) -->
<div id="topHeader">
    <button id="calcBtn" style="background: #00ff88; color:#0f5132; border:none; border-radius:8px; padding:8px 12px; font-weight:bold; cursor:pointer; margin-left:5px;">🧮 Calc</button>
    <div><small>Subject:</small> <br><span id="subjectTitle">---</span></div>
    <div id="timerDisplay">00:00</div>
    <div><small>Progress:</small> <br><span id="qCount">0/0</span></div>
</div>

<!-- START OVERLAY -->
<div id="startOverlay">
    <h1>BRAINS AI PORTAL</h1>
    <p>Security Monitoring is Active</p>
    <button id="startExamBtn" style="padding: 20px 40px; background: var(--primary); font-size: 1.2em;">START EXAMINATION</button>
</div>

<!-- MAIN EXAM CONTAINER (flex: palette + question area) -->
<div class="exam-wrapper" id="examBox" style="display:none;">
    <!-- Question Palette (numbered buttons) -->
    <div id="questionPalette" class="palette"></div>
    
    <!-- Question area -->
    <div class="exam-container">
        <div id="questionArea"></div>
        <div class="nav-buttons">
            <button class="btn-nav" id="prevBtn">PREVIOUS</button>
            <button class="btn-nav" id="nextBtn">NEXT</button>
        </div>
        <button class="btn-submit" id="finalSubmit" style="width:100%; margin-top:30px; display:none;">SUBMIT FINISH</button>
    </div>
</div>

<!-- CALCULATOR MODAL (scientific) -->
<div id="calculatorModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1a1a1a; border:2px solid #00ff88; border-radius:15px; padding:20px; width:360px; z-index:10000; box-shadow:0 0 20px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="color:#00ff88; font-weight:bold;">🧮 Scientific Calculator</span>
        <div style="display:flex; gap:8px; align-items:center;">
            <button id="degRadToggle" style="background:#333; color:#00ff88; border:1px solid #00ff88; border-radius:6px; padding:4px 10px; font-size:0.75rem; cursor:pointer; font-weight:bold;">DEG</button>
            <button id="closeCalcBtn" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;">✕</button>
        </div>
    </div>
    <input type="text" id="calcDisplay" readonly style="width:100%; padding:10px; background:#333; color:#fff; border:none; border-radius:5px; margin-bottom:10px; text-align:right; font-size:1.2rem; box-sizing:border-box;">
    
    <!-- Row 1: Trig & log functions -->
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:5px;">
        <button class="calc-btn" data-val="sin(">sin</button>
        <button class="calc-btn" data-val="cos(">cos</button>
        <button class="calc-btn" data-val="tan(">tan</button>
        <button class="calc-btn" data-val="log(">log</button>
        <button class="calc-btn" data-val="ln(">ln</button>
    </div>
    <!-- Row 2: Other scientific -->
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:5px;">
        <button class="calc-btn" data-val="sqrt(">√</button>
        <button class="calc-btn" data-val="^2">x²</button>
        <button class="calc-btn" data-val="^">xʸ</button>
        <button class="calc-btn" data-val="1/">1/x</button>
        <button class="calc-btn" data-val="%(">%</button>
    </div>
    <!-- Row 3: Constants & brackets -->
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:8px;">
        <button class="calc-btn" data-val="PI">π</button>
        <button class="calc-btn" data-val="E">e</button>
        <button class="calc-btn" data-val="(">(</button>
        <button class="calc-btn" data-val=")">)</button>
        <button class="calc-btn" data-val="CE" style="background:#ff8800;">⌫</button>
    </div>
    <!-- Row 4–7: Numbers and operators -->
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px;">
        <button class="calc-btn" data-val="7">7</button>
        <button class="calc-btn" data-val="8">8</button>
        <button class="calc-btn" data-val="9">9</button>
        <button class="calc-btn" data-val="/" style="background:#555;">÷</button>

        <button class="calc-btn" data-val="4">4</button>
        <button class="calc-btn" data-val="5">5</button>
        <button class="calc-btn" data-val="6">6</button>
        <button class="calc-btn" data-val="*" style="background:#555;">×</button>

        <button class="calc-btn" data-val="1">1</button>
        <button class="calc-btn" data-val="2">2</button>
        <button class="calc-btn" data-val="3">3</button>
        <button class="calc-btn" data-val="-" style="background:#555;">−</button>

        <button class="calc-btn" data-val="0">0</button>
        <button class="calc-btn" data-val=".">.</button>
        <button class="calc-btn" data-val="=" style="background:#00ff88; color:#0f5132;">=</button>
        <button class="calc-btn" data-val="+" style="background:#555;">+</button>

        <button class="calc-btn" data-val="C" style="background:#ff4444; grid-column:span 4;">C (Clear All)</button>
    </div>
</div>

<script src="exam.js"></script>
</body>
</html>
