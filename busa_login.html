<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bursary Login | BRAINS AI</title>
    <link rel="stylesheet" href="busa_login.css">


    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'wasm-unsafe-eval';
               style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com;
               img-src 'self' data: https:;
               connect-src 'self' https://gjznwgzoqpfdnxywixgv.supabase.co;
               font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
               frame-src https://meet.jit.si;
               frame-ancestors 'none';">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>🧠 BRAINS AI</h2>
            <p>Bursary Clearance Portal</p>
        </div>

        <div class="form-group">
            <label>Official Email</label>
            <input type="email" id="email" placeholder="bursar@school.edu" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button id="loginBtn" class="btn-login">LOGIN</button>

        <!-- Lockout countdown message -->
        <p id="lockoutMsg"
           style="display:none; color:#ff6b6b; font-weight:bold; margin-top:10px; text-align:center;">
        </p>

        <div class="login-footer">
            <small>Authorized bursary staff only.</small>
        </div>
    </div>
</div>

<script src="busa_login.js"></script>
</body>
</html>
