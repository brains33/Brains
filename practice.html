<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Mode | BRAINS AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- CSP (Content Security Policy) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
                   style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
                   img-src 'self' data: https:;
                   connect-src 'self' https://gjznwgzoqpfdnxywixgv.supabase.co;
                   font-src 'self' https://cdnjs.cloudflare.com;
                   frame-src https://meet.jit.si;">

    <style>
        :root {
            --primary-green: #00ff88;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-white: #ffffff;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .practice-container { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary-green); font-size: 2.5rem; margin-bottom: 5px; }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid var(--primary-green);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-green);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { opacity: 0.8; transform: translateY(-2px); }

        .q-card { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .option-label {
            display: block;
            background: #252525;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .option-label:hover { border-color: var(--primary-green); }
        .btn-outline { background: transparent; color: #aaa; border: 1px solid #444; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="practice-container">
        <header>
            <h1><i class="fas fa-brain"></i> BRAINS AI</h1>
            <p>Practice Mode: Powered by Mu'ujiza Data</p>
        </header>

        <div id="setupArea" class="card">
            <h3>Enter Course Code</h3>
            <input type="text" id="courseCode" placeholder="e.g. ANA201" style="text-transform: uppercase;">
            <button id="startBtn">Generate Questions</button>
        </div>

        <div id="quizArea" style="display:none;">
            <div id="questionsContainer"></div>
            <button id="submitBtn">Submit & Grade</button>
            <button id="tryAgainBtn" class="btn-outline">Try Another Subject</button>
        </div>

        <div id="resultArea" class="card" style="display:none; text-align: center;">
            <h2 id="scoreDisplay">0%</h2>
            <p id="remarkDisplay"></p>
            <button id="doneBtn">Done</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="practice.js"></script>
</body>
</html>
