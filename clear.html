<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Clearance | BRAINS AI</title>
    <style>
        :root {
            --green: #00ff88;
            --dark: #040d07;
            --card: #081a0f;
            --field: #0d2618;
            --border: rgba(0,255,136,0.15);
            --text: #e2f5eb;
            --muted: rgba(226,245,235,0.45);
            --error: #ff6b6b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.8rem; color: var(--green); margin-bottom: 10px; }
        p { color: var(--muted); margin-bottom: 25px; font-size: 0.95rem; }
        .field {
            margin-bottom: 15px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .field input {
            width: 100%;
            padding: 14px;
            background: var(--field);
            border: 1px solid rgba(0,255,136,0.15);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        .field input:focus { border-color: var(--green); }
        button {
            width: 100%;
            padding: 15px;
            background: var(--green);
            color: var(--dark);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.97); }
        .msg {
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 22px;
        }
        .msg.success { color: var(--green); }
        .msg.error { color: var(--error); }
        a { color: var(--green); text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🧠 BRAINS AI</h1>
    <p>Activate your student account with the clearance token provided by the bursary.</p>

    <div class="field">
        <label>Matrix / Student ID</label>
        <input type="text" id="matrixNo" placeholder="e.g. MLT/23/001" autocomplete="off">
    </div>

    <div class="field">
        <label>Clearance Token</label>
        <input type="text" id="token" placeholder="e.g. A3F9K2" autocomplete="off">
    </div>

    <button onclick="verifyClearance()">ACTIVATE ACCOUNT</button>
    <div id="msgBox" class="msg"></div>

    <p style="margin-top: 20px; font-size: 0.8rem; color: var(--muted);">
        Already approved? <a href="student_login.html">Login here</a>
    </p>
</div>

<script>
const PROXY_URL = 'https://gjznwgzoqpfdnxywixgv.supabase.co/functions/v1/busa-proxy';

async function verifyClearance() {
    const matrixNo = document.getElementById('matrixNo').value.trim();
    const token = document.getElementById('token').value.trim();
    const msgEl = document.getElementById('msgBox');

    if (!matrixNo || !token) {
        msgEl.className = 'msg error';
        msgEl.innerText = 'Please fill both fields.';
        return;
    }

    const btn = document.querySelector('button');
    btn.disabled = true;
    btn.innerText = 'Verifying...';
    msgEl.className = 'msg';
    msgEl.innerText = '';

    try {
        const resp = await fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'verify-clearance-by-matrix',
                matrixNo: matrixNo.toUpperCase(),
                code: token.toUpperCase()
            })
        });

        const result = await resp.json();

        if (!resp.ok) {
            msgEl.className = 'msg error';
            msgEl.innerText = result.error || 'Verification failed.';
        } else {
            msgEl.className = 'msg success';
            msgEl.innerText = result.message || 'Account approved! Redirecting to login...';
            setTimeout(() => {
                window.location.href = 'student_login.html';
            }, 2000);
        }
    } catch (err) {
        msgEl.className = 'msg error';
        msgEl.innerText = 'Network error. Please try again.';
    } finally {
        btn.disabled = false;
        btn.innerText = 'ACTIVATE ACCOUNT';
    }
}

// Allow Enter key to submit
document.getElementById('token').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') verifyClearance();
});
</script>

</body>
</html>
